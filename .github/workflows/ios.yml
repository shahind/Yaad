name: iOS unsigned IPA

# Builds an unsigned .ipa (for sideloading / re-signing with AltStore, Sideloadly, etc.)
# and attaches it to the GitHub release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the IPA to (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dictionary data
        run: npm run build:data

      - name: Search smoke test
        run: npm test

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          VERSION="${TAG#v}"
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "Yaad-${VERSION}-ios-unsigned.ipa" Payload
          ls -la *.ipa
          echo "IPA=Yaad-${VERSION}-ios-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.IPA }}

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ env.IPA }}
