apply plugin: 'com.android.application'

android {
    namespace = "com.shahinsoft.yaad"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.shahinsoft.yaad"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing: point YAAD_KEYSTORE_PROPERTIES at a properties file with
    // storeFile, storePassword, keyAlias and keyPassword (kept outside the repo).
    def ksProps = new Properties()
    def ksPath = System.getenv('YAAD_KEYSTORE_PROPERTIES')
    if (ksPath && file(ksPath).exists()) file(ksPath).withInputStream { ksProps.load(it) }
    project.ext.releaseKs = ksProps
    signingConfigs {
        release {
            if (ksProps['storeFile']) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (ksProps['storeFile']) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Cafe Bazaar: every signed bundleRelease also writes app-release.bin (the signed digest
// Bazaar asks for) next to app-release.aab, using Bazaar's bundlesigner. The jar is fetched
// once from github.com/cafebazaar/bundle-signer into tools/bazaar/ (git-ignored) and checked
// against its SHA-256. Set bundleSigner=<path to jar> in the keystore properties to override.
def bundleSignerVersion = '0.1.14'
def bundleSignerSha256 = 'aef2c387f678558e3a4baddab9730fbdca64ef28a0e2e0245491e1088b4968f5'
tasks.register('bazaarBin', Exec) {
    def ks = project.ext.releaseKs
    def aab = file("$buildDir/outputs/bundle/release/app-release.aab")
    def jar = file(ks['bundleSigner'] ?: "$rootDir/../tools/bazaar/bundlesigner-${bundleSignerVersion}.jar")
    onlyIf {
        def ok = ks['storeFile'] && aab.exists()
        if (!ok) logger.warn("bazaarBin skipped: needs the release keystore and ${aab.name}")
        ok
    }
    doFirst {
        if (!jar.exists()) {
            jar.parentFile.mkdirs()
            def url = "https://github.com/cafebazaar/bundle-signer/releases/download/v${bundleSignerVersion}/bundlesigner-${bundleSignerVersion}.jar"
            logger.lifecycle("Downloading ${url}")
            def tmp = file("${jar}.part")
            new URL(url).withInputStream { i -> tmp.withOutputStream { it << i } }
            def sha = java.security.MessageDigest.getInstance('SHA-256').digest(tmp.bytes).encodeHex().toString()
            if (!ks['bundleSigner'] && sha != bundleSignerSha256) { tmp.delete(); throw new GradleException("bundlesigner checksum mismatch: ${sha}") }
            tmp.renameTo(jar)
        }
    }
    commandLine "${System.getProperty('java.home')}/bin/java", '-jar', jar,
        'genbin', '-v', '--bundle', aab, '--bin', aab.parentFile,
        '--v2-signing-enabled', 'true', '--v3-signing-enabled', 'false',
        '--ks', ks['storeFile'] ? file(ks['storeFile']) : '', '--ks-key-alias', ks['keyAlias'] ?: '',
        '--ks-pass', 'env:BAZAAR_KS_PASS', '--key-pass', 'env:BAZAAR_KEY_PASS'
    environment 'BAZAAR_KS_PASS', ks['storePassword'] ?: ''
    environment 'BAZAAR_KEY_PASS', ks['keyPassword'] ?: ''
}
afterEvaluate { tasks.named('bundleRelease') { finalizedBy 'bazaarBin' } }
